name: CI

on:
  push:
    branches: [main, master]
  pull_request:

# Cancel superseded runs on the same ref.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Generate Prisma once before typecheck/build/lint so parallel @scp/db
      # tasks cannot race two `prisma generate` runs and leave a broken client.
      - name: Generate Prisma client
        run: pnpm --filter @scp/db generate
        env:
          DATABASE_URL: postgresql://ci:ci@127.0.0.1:5432/ci

      # Prisma client is generated above (no DB connection required). The unit
      # tests (crypto vault + RBAC guard) are pure and need no Postgres, so no
      # service container is provisioned here.
      - name: Typecheck
        run: pnpm typecheck
        env:
          DATABASE_URL: postgresql://ci:ci@127.0.0.1:5432/ci

      - name: Lint
        run: pnpm lint
        env:
          DATABASE_URL: postgresql://ci:ci@127.0.0.1:5432/ci

      - name: Build
        run: pnpm build
        env:
          DATABASE_URL: postgresql://ci:ci@127.0.0.1:5432/ci

      - name: Unit tests
        run: pnpm test
        env:
          DATABASE_URL: postgresql://ci:ci@127.0.0.1:5432/ci
